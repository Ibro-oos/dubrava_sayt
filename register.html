<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - «Дубрава»</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth-styles.css">
</head>
<body>

    <header class="header">
        <div class="container header-top">
            <a href="index.html" class="logo">ДУБРАВА<span>.</span></a>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="about.html">О нас</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <a href="cart.html" title="Корзина">🛒</a>
                <a href="auth-choice.html" title="Личный кабинет">👤</a>
            </div>
        </div>
    </header>

    <main class="auth-section">
        <div class="container">
            <div class="auth-card">
                <h1>Регистрация</h1>
                <p class="auth-subtitle">Заполните форму, чтобы создать личный кабинет</p>

                <form action="#" method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="fullname">Ваше имя и фамилия</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Иван Иванов" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail адрес</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Номер телефона</label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 (999) 000-00-00" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Придумайте пароль</label>
                        <input type="password" id="password" name="password" placeholder="Минимум 8 символов" minlength="8" required>
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Повторите пароль</label>
                        <input type="password" id="password_confirm" name="password_confirm" placeholder="Повторите пароль" minlength="8" required>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" name="terms" required>
                            <span>Я согласен на <a href="#">обработку персональных данных</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-block">Создать аккаунт</button>
                </form>

                <div class="auth-divider"><span>или</span></div>

                <div class="auth-switch">
                    Уже зарегистрированы? <a href="login.html">Войти в аккаунт</a>
                </div>

                <div class="auth-footer-note">
                    <a href="auth-choice.html" class="back-link">← Назад к выбору</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Мебельная фабрика «Дубрава». Все права защищены.</p>
            </div>
        </div>
    </footer>

</body>
</html>
