<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог - Дубрава</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalog-modal.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header-top">
            <a href="index.html" class="logo">ДУБ<span>РАВА</span></a>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="sales.html">Акции</a></li>
                    <li><a href="about.html">О нас</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <a href="cart.html">🛒</a>
                <a href="auth-choice.html">👤</a>
            </div>
        </div>
    </div>
</header>

<section class="section">
    <div class="container">
        <h1 class="section-title">Каталог мебели</h1>
        <p class="section-subtitle" id="count">Загрузка...</p>

        <div class="catalog-layout">
            <aside class="filters">
                <h3>Фильтры</h3>
                <div class="filter-group">
                    <strong>Категория</strong>
                    <label><input type="checkbox"> Диваны</label>
                    <label><input type="checkbox"> Столы</label>
                    <label><input type="checkbox"> Кровати</label>
                    <label><input type="checkbox"> Шкафы</label>
                    <label><input type="checkbox"> Стулья</label>
                </div>
                <div class="filter-group">
                    <strong>Материал</strong>
                    <label><input type="checkbox"> Дуб</label>
                    <label><input type="checkbox"> Ясень</label>
                    <label><input type="checkbox"> Бук</label>
                    <label><input type="checkbox"> Сосна</label>
                </div>
                <div class="filter-group">
                    <strong>Цена, ₽</strong>
                    <label><input type="checkbox"> до 50 000</label>
                    <label><input type="checkbox"> 50 000 - 100 000</label>
                    <label><input type="checkbox"> свыше 100 000</label>
                </div>
                <button class="btn" style="width:100%;">Применить</button>
            </aside>

            <div id="product-grid" class="grid-3"></div>
        </div>
    </div>
</section>

<!-- модальное окно -->
<section id="detail-section" class="modal hidden">
    <div class="modal-content">
        <span id="close-btn" class="close">&times;</span>
        <div id="detail-card"></div>
        <button class="bay" style="width:100%";> Купить </button>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom">© 2026 Дубрава. Все права защищены.</div>
    </div>
</footer>

<script src="js/catalog.js"></script>
</body>
</html>
